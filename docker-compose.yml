
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: academic-copilot-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: academic_copilot
      POSTGRES_USER: academic_admin
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - academic_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_admin -d academic_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  academic_pgdata:
